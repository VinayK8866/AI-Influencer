name: Maya Instagram Autopilot

on:
  schedule:
    # Run every day at 10:00 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore State Cache
        uses: actions/cache@v4
        with:
          path: |
            maya_autopilot/state.json
            maya_autopilot/ig_session.json
          # Using a static key but always saving it at the end to persist state across runs
          key: maya-state-${{ github.run_id }}
          restore-keys: |
            maya-state-

      - name: Load Backup Instagram Session
        env:
          IG_SESSION_BASE64: ${{ secrets.IG_SESSION_BASE64 }}
        run: |
          python3 -c "
          import os, base64, json
          session_path = 'maya_autopilot/ig_session.json'
          valid = False
          if os.path.exists(session_path):
              try:
                  with open(session_path, 'r') as f:
                      json.load(f)
                  valid = True
                  print('Existing cached session is valid JSON. Skipping restore.')
              except Exception as e:
                  print(f'Cached session file is corrupted/invalid: {e}. Removing to force restore.')
                  try:
                      os.remove(session_path)
                  except:
                      pass
          
          if not valid:
              b64_data = os.environ.get('IG_SESSION_BASE64', '').strip()
              if b64_data:
                  print('Restoring session from IG_SESSION_BASE64 secret...')
                  try:
                      # Add missing padding if needed
                      missing_padding = len(b64_data) % 4
                      if missing_padding:
                          b64_data += '=' * (4 - missing_padding)
                      decoded = base64.b64decode(b64_data)
                      # Verify decoded data is valid JSON before writing
                      json.loads(decoded)
                      os.makedirs(os.path.dirname(session_path), exist_ok=True)
                      with open(session_path, 'wb') as f:
                          f.write(decoded)
                      print('Successfully restored and verified backup session.')
                  except Exception as e:
                      print(f'Failed to restore/verify backup session: {e}')
              else:
                  print('IG_SESSION_BASE64 secret is not configured.')
          "

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r maya_autopilot/requirements.txt

      - name: Run Autopilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MUAPI_API_KEY: ${{ secrets.MUAPI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_PROXY: ${{ secrets.IG_PROXY }}
        run: |
          cd maya_autopilot
          python main.py

      - name: Check State Files
        if: always()
        id: check_files
        run: |
          python3 -c "
          import os, json
          state_exists = os.path.exists('maya_autopilot/state.json') and os.path.getsize('maya_autopilot/state.json') > 0
          session_valid = False
          session_path = 'maya_autopilot/ig_session.json'
          if os.path.exists(session_path):
              try:
                  with open(session_path, 'r') as f:
                      json.load(f)
                  session_valid = True
              except:
                  pass
          
          # We save the cache if state exists OR we have a valid session to avoid cold start issues next time
          if state_exists or session_valid:
              print('Valid state or session file detected. Enabling cache save.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('files_exist=true\n')
          else:
              print('No valid state or session files to cache.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('files_exist=false\n')
          "

      - name: Save State Cache
        if: always() && steps.check_files.outputs.files_exist == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            maya_autopilot/state.json
            maya_autopilot/ig_session.json
          key: maya-state-${{ github.run_id }}

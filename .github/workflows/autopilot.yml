name: Maya Instagram Autopilot

on:
  schedule:
    # Run every day at 10:00 AM UTC
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  run-autopilot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore State Cache
        uses: actions/cache@v4
        with:
          path: |
            maya_autopilot/state.json
            maya_autopilot/ig_session.json
          # Using a static key but always saving it at the end to persist state across runs
          key: maya-state-${{ github.run_id }}
          restore-keys: |
            maya-state-

      - name: Load Backup Instagram Session
        env:
          IG_SESSION_BASE64: ${{ secrets.IG_SESSION_BASE64 }}
        run: |
          if { [ ! -f maya_autopilot/ig_session.json ] || [ ! -s maya_autopilot/ig_session.json ]; } && [ ! -z "$IG_SESSION_BASE64" ]; then
            echo "Session not found or empty in cache. Restoring from backup secret..."
            python3 -c "import base64, os; s = os.environ['IG_SESSION_BASE64'].strip('\'\" \n\r'); s = s + 'Q==' if (len(s) == 1685 and s.endswith('f')) else s; s = s + '=' * (4 - (len(s) % 4)) if len(s) % 4 != 0 else s; open('maya_autopilot/ig_session.json', 'wb').write(base64.b64decode(s))"
          fi

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r maya_autopilot/requirements.txt

      - name: Run Autopilot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MUAPI_API_KEY: ${{ secrets.MUAPI_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_PROXY: ${{ secrets.IG_PROXY }}
        run: |
          cd maya_autopilot
          python main.py

      - name: Check State Files
        if: always()
        id: check_files
        run: |
          if [ -s maya_autopilot/state.json ] && [ -s maya_autopilot/ig_session.json ]; then
            echo "files_exist=true" >> $GITHUB_OUTPUT
          else
            echo "files_exist=false" >> $GITHUB_OUTPUT
          fi

      - name: Save State Cache
        if: always() && steps.check_files.outputs.files_exist == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            maya_autopilot/state.json
            maya_autopilot/ig_session.json
          key: maya-state-${{ github.run_id }}
